# Ovara project metadata.
#
# Adding pyproject.toml lets the project be installed in editable mode with
#   pip install -e .
# That makes every module importable from anywhere without sys.path tricks
# and gives downstream tooling (linters, test runners) a real package to
# point at instead of a flat folder.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovara"
version = "0.1.0"
description = "Reproductive health provider access modeling pipeline (INST737 final project)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Kenneth Yeaher"},
]

# core runtime dependencies, kept loose so the install does not fight pip
# the full pinned set lives in requirements.txt for reproducibility
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.18",
    "dash>=4.0",
    "dash-bootstrap-components>=2.0",
    "requests>=2.31",
    "openpyxl>=3.1",
]

[tool.setuptools]
# the project is structured as a flat workspace of folders rather than one
# package, so list each top level folder explicitly
packages = ["analysis", "etl", "utils", "vis"]
